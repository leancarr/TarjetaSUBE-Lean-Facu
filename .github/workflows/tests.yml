name: .NET Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Transporte.slnx

    - name: Build
      run: dotnet build Transporte.slnx --no-restore

    - name: Test
      run: dotnet test Transporte.slnx --no-build --verbosity normal
